<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>DSH 插件面板 · 截图自检环境（stub host）</title>
<!-- 真实 webview 源码编译产物；宿主消息用桩喂进去，目的是"能看见界面" -->
<link rel="stylesheet" href="../../webview/src/styles.css" />
<style>
  html, body { height: 100%; margin: 0; background: var(--vscode-editor-background, #1e1e1e); }
  /* 模拟 VSCode 主题变量（默认 Dark Modern 取值），让样式有颜色 */
  :root {
    --vscode-editor-background: #1e1e1e; --vscode-foreground: #cccccc;
    --vscode-descriptionForeground: #9d9d9d; --vscode-widget-border: #3c3c3c;
    --vscode-list-hoverBackground: #2a2d2e; --vscode-list-activeSelectionBackground: #04395e;
    --vscode-list-activeSelectionForeground: #ffffff; --vscode-badge-background: #4d4d4d;
    --vscode-badge-foreground: #ffffff; --vscode-button-background: #0e639c;
    --vscode-button-foreground: #ffffff; --vscode-focusBorder: #0078d4;
    --vscode-editorWidget-background: #252526; --vscode-input-background: #313131;
    --vscode-input-foreground: #cccccc; --vscode-input-border: #3c3c3c;
    --vscode-editor-font-family: Consolas, "Cascadia Mono", monospace;
    --vscode-editorWarning-foreground: #cca700; --vscode-errorForeground: #f48771;
    --vscode-textCodeBlock-background: #1b1b1b; --vscode-charts-blue: #3794ff;
    --vscode-charts-green: #89d185; --vscode-charts-purple: #b180d7;
    --dsh-fg: #cccccc; --dsh-muted: #9d9d9d; --dsh-accent: #0078d4; --dsh-btn-fg: #ffffff;
    --dsh-card: #252526; --dui-card: #252526; --dui-border: #3c3c3c;
  }
  #stage { height: 100%; display: flex; justify-content: center; padding: 10px; box-sizing: border-box; }
  /* webview 产物挂载到 #root（原先给的是 #panel，导致 React 没挂上、整屏空白） */
  #root { width: var(--panel-w, 640px); height: 100%; display: flex; flex-direction: column; overflow: hidden;
          border: 1px solid #3c3c3c; border-radius: 6px; }
  #log { display: none; position: fixed; left: 8px; bottom: 8px; max-width: 44vw; max-height: 22vh; overflow: auto;
         font: 11px/1.45 Consolas, monospace; color: #8a8a8a; background: rgba(0,0,0,.55); padding: 6px 8px; border-radius: 6px; }
  #hint { display: none; position: fixed; right: 8px; bottom: 8px; font: 11px/1.5 Consolas, monospace; color: #8a8a8a;
          background: rgba(0,0,0,.55); padding: 6px 8px; border-radius: 6px; }
</style>
</head>
<body>
<div id="stage"><div id="root"></div></div>
<div id="bootstate" style="position:fixed;left:8px;top:4px;color:#f48771;font:12px Consolas,monospace;z-index:99">JS 未执行</div>
<script>
  // 独立探针：即使其它内联脚本解析失败也要能报错（放在所有脚本最前）
  window.addEventListener("error", function (e) {
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;left:8px;top:26px;right:8px;color:#f48771;font:12px Consolas,monospace;white-space:pre-wrap;z-index:99";
    d.textContent = "ERR: " + (e.message || e.reason || e.error) + "  @" + String(e.filename || "").split("/").pop() + ":" + e.lineno;
    (document.body || document.documentElement).appendChild(d);
  });
  window.addEventListener("unhandledrejection", function (e) {
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;left:8px;top:26px;right:8px;color:#f48771;font:12px Consolas,monospace;white-space:pre-wrap;z-index:99";
    d.textContent = "REJECT: " + (e.reason && e.reason.message ? e.reason.message : e.reason);
    (document.body || document.documentElement).appendChild(d);
  });
</script>
<div id="log"></div>
<div id="hint">查询参数：?w=640（面板宽）&amp;drawer=sessions|jobs|settings|…（打开哪个抽屉，由 app 自读）&amp;long=1（超长会话标题）&amp;goal=0（不发 goal 投影 ⇒ 胶囊显示"设目标"态）</div>

<script>
  // ── 1) 桩宿主：webview 通过 window.__dshApi.postMessage 上行 ──
  const params = new URLSearchParams(location.search);
  const width = Number(params.get("w") || 640);
  document.documentElement.style.setProperty("--panel-w", width + "px");
  // drawer: 由 app.tsx 自读 location.search（?drawer= 钩子），harness 不再代点按钮。
  const drawer = params.get("drawer") ?? "";
  /** 超长会话标题：复现"长标题把右侧胶囊挤出可视区"（真实用户的会话标题常有 20+ 汉字）。 */
  const LONG = params.get("long") === "1";
  /** goal=0：不发 goal 投影 ⇒ 胶囊只剩「◎ 设目标」，检查零状态下是否仍可见。 */
  const WITH_GOAL = params.get("goal") !== "0";
  const sent = [];
  const api = {
    postMessage(m) { sent.push(m); if (m && m.t === "ready") feed(); },
    getState: () => ({}),
    setState: () => {},
  };
  window.__dshApi = api;
  window.acquireVsCodeApi = () => api;
  const logEl = document.getElementById("log");
  document.getElementById("bootstate").textContent = "JS 已执行"; const log = (s) => { logEl.textContent += s + "\n"; logEl.scrollTop = logEl.scrollHeight; };
  // 让空白屏变成可诊断的：任何脚本错误与未捕获拒绝都写进左下角日志（截图即可见）
  window.addEventListener("error", (e) => log("✗ error: " + (e.message || e.error) + " @" + (e.filename || "").split("/").pop() + ":" + e.lineno));
  window.addEventListener("unhandledrejection", (e) => log("✗ reject: " + (e.reason && e.reason.message ? e.reason.message : e.reason)));
  setTimeout(() => {
    const root = document.getElementById("root");
    log("mount#root children=" + (root ? root.children.length : "null") + " bodyH=" + document.body.clientHeight);
  }, 1500);

  // ── 2) 假数据（形状对齐真实 wire）──
  const SESSIONS = [
    { sessionId: "s1", title: LONG ? "1/3 屏宽，最高频就是发消息、切会话、看你在干什么" : "需求三批 UI 重构方案讨论", running: true, blank: false, cwd: "D:\\03-Projects\\Plugins\\dsh-vscode" },
    { sessionId: "s2", title: "插件面板 UI 不好看排查", running: false, blank: false, cwd: "D:\\03-Projects\\Plugins\\dsh-vscode" },
    { sessionId: "s3", title: "桌面版能力盘点（136 端点）", running: false, blank: false, cwd: "D:\\03-Projects\\Plugins\\dsh-vscode" },
    { sessionId: "s4", title: "子代理链路修复验证", running: true, blank: false, cwd: "D:\\03-Projects\\Plugins\\dsh-vscode", subagents: { total: 3, running: 1 } },
    { sessionId: "s5", title: "定时提醒与任务面板", running: false, blank: false, cwd: "D:\\01-Work" },
    { sessionId: "s6", title: "反诈预警策略分析", running: false, blank: false, cwd: "D:\\01-Work" },
    { sessionId: "s7", title: "（未命名会话）", running: false, blank: true, cwd: "D:\\01-Work" },
    { sessionId: "s8", title: "旧 CLI 迁移记录", running: false, blank: false, cwd: "D:\\01-Work" },
  ];
  const HISTORY = [
    { event: { type: "user/message", seq: 1, time: Date.now() - 60000, data: { content: [{ type: "text", text: "1/3 屏宽，最高频就是发消息、切会话、看你在干什么" }], source: { kind: "user" } } } },
    { event: { type: "turn/start", seq: 2, time: Date.now() - 59000, data: { turn: 1 } } },
    { event: { type: "assistant/message", seq: 3, time: Date.now() - 58000, data: { turn: 1, step: 1, message: { content: [{ type: "text", text: "先说结论，再给分层。段落之间留 10px，读起来不糊成一块。" }] } } } },
    { event: { type: "turn/end", seq: 4, time: Date.now() - 57000, data: { turn: 1 } } },
  ];
  const TOOLS = [
    { callId: "c1", name: "read" }, { callId: "c2", name: "edit" }, { callId: "c3", name: "pwsh" }, { callId: "c4", name: "edit" },
  ];

  function feed() {
    const send = (m) => window.postMessage(m, "*");
    send({ t: "conn", state: "connected", baseUrl: "http://127.0.0.1:19387" });
    send({ t: "caps", flavor: "v012" });
    send({ t: "sessions", items: SESSIONS, current: "s1" });
    send({
      t: "workspaces",
      items: [
        { workspaceId: "w1", path: "D:\\03-Projects\\Plugins\\dsh-vscode", title: "dsh-vscode", sessionIds: ["s1", "s2", "s3", "s4"] },
        { workspaceId: "w2", path: "D:\\01-Work", title: "01-Work", sessionIds: ["s5", "s6", "s7", "s8"] },
      ],
      archivedSessionIds: ["s8"],
      pinnedSessionIds: ["s2"],
    });
    send({ t: "flags", archivedSessionIds: ["s8"], pinnedSessionIds: ["s2"] });
    send({ t: "history", sessionId: "s1", entries: HISTORY, hasMore: true });
    if (WITH_GOAL) send({ t: "projection", sessionId: "s1", key: "goal", value: { goal: { id: "g1", revision: 3, objective: "把面板 UI 按设计图重构完", phase: "active", maxGoalRounds: 12 }, roundsStarted: 4 } });
    send({ t: "projection", sessionId: "s1", key: "inbox", value: { "next-turn": [{ id: "m1", content: [{ type: "text", text: "先按 B 做，顺便把会话区也重排" }] }, { id: "m2", content: [{ type: "text", text: "截图自检要能切宽窄档" }] }], "next-step": [] } });
    send({ t: "projection", sessionId: "s1", key: "contextPressure", value: { pressure: 0.62 } });
    send({ t: "tokens", label: "12.4k tokens" });
    send({ t: "presets", data: { presets: [{ id: "default", name: "默认装配", isDefault: true }] } });
    send({ t: "models", sessionId: "s1", data: { current: { provider: "deepseek", model: "deepseek-v4.1" }, routable: true, groups: [{ id: "deepseek", name: "DeepSeek", models: [{ id: "deepseek-v4.1", name: "deepseek-v4.1" }, { id: "deepseek-v3.2", name: "deepseek-v3.2" }] }, { id: "zhipu", name: "智谱", models: [{ id: "glm-5.3", name: "glm-5.3" }] }], failures: [] } });
    // 设置域（需求三 UI 修正批）：宿主侧偏好 + 本会话权限 + 服务器 schema（高级区）
    send({ t: "prefs", data: { defaultModel: "deepseek/deepseek-v4.1", autoStart: true, baseUrl: "http://127.0.0.1:19387", baseUrlPinned: false, instanceLabel: "桌面版 App · 127.0.0.1:19387" } });
    send({ t: "permission", data: { value: "default", revision: 3, presets: [{ id: "default", label: "默认装配" }, { id: "read-only", label: "只读" }, { id: "danger-full-access", label: "完全放行" }] } });
    send({ t: "settings-describe", data: { writable: true, hasDocument: true, namespaces: [
      { ns: "agent", applies: "live", revision: 7, secrets: [{ path: ["apiKey"], set: true }], value: { maxSteps: 60, streaming: true, apiKey: "" }, base: { maxSteps: 40 }, user: { maxSteps: 60 },
        schema: { uid: "agent", dict: { maxSteps: 1, streaming: 2, apiKey: 3 }, refs: { 1: { type: "number", meta: { step: 1, min: 1, max: 200, default: 40 } }, 2: { type: "boolean", meta: { default: true } }, 3: { type: "string", meta: { role: "secret" } } } } }
    ] } });
    // 伪造若干工具事件，验证"工具组折叠"
    for (const [i, t] of TOOLS.entries()) {
      send({ t: "mux-batch", sessionId: "s1", frames: [
        { event: { type: "tool/call", seq: 10 + i * 2, time: Date.now() - 50000 + i * 1000, data: { turn: 2, step: i + 1, callId: t.callId, name: t.name, arguments: "{}" } } },
        { event: { type: "tool/result", seq: 11 + i * 2, time: Date.now() - 49500 + i * 1000, data: { turn: 2, step: i + 1, callId: t.callId, result: "ok" } } },
      ] });
    }
    log("fed: conn/sessions/workspaces/history/projections/tools" + (drawer ? " + drawer=" + drawer : ""));
  }
  window.addEventListener("message", (e) => {
    const m = e.data;
    if (m && m.t) log("↑ " + m.t + (m.sessionId ? " (" + m.sessionId + ")" : ""));
  });
</script>
<script src="../../dist/webview.js"></script>
<script>
  // 抽屉不再由 harness 代点按钮：app.tsx 自读 ?drawer=（在 dist/webview.js 的首帧渲染前
  // 就决定了初始 state，比"等按钮出来再 click"更可靠，也不会每次截图都强制开抽屉）。
  setTimeout(() => {
    const opened = document.querySelector(".sheet-overlay");
    log("drawer param=" + (drawer || "(none)") + " → " + (opened ? "已打开" : "未打开"));
    // 布局诊断（--dump-dom 可见）：面板比 viewport 宽 ⇒ 某处 min-content 撑破，
    // 头部右端的胶囊 / ⋯ 会被推到可视区之外（"看不到胶囊"的真因）。
    const root = document.getElementById("root");
    const app = document.querySelector(".app");
    const hrow = document.querySelector(".header-session-row");
    const cap = document.querySelector(".capsule");
    log("layout: viewport=" + window.innerWidth + " root.clientW=" + (root ? root.clientWidth : "?") +
        " app.scrollW=" + (app ? app.scrollWidth : "?") +
        " headerRow.scrollW=" + (hrow ? hrow.scrollWidth : "?") +
        " capsule.right=" + (cap ? Math.round(cap.getBoundingClientRect().right) : "?"));
    // 胶囊的实际生效色（主题相关件：确认"没被主题变量弄成不可见"）
    if (cap) {
      const cs = getComputedStyle(cap);
      log("capsule style: bg=" + cs.backgroundColor + " color=" + cs.color + " border=" + cs.borderTopColor);
    }
    // 最小内容宽度体检：把面板压到 120px（会被 min-content 顶回去），谁不肯收缩一目了然
    if (root && hrow) {
      const keep = root.style.width;
      root.style.width = "120px";
      const kids = [...hrow.children].map((c) => (c.className || c.tagName) + "=" + Math.round(c.getBoundingClientRect().width)).join(" ");
      log("minContent: headerRow=" + Math.round(hrow.getBoundingClientRect().width) +
          " [" + kids + "] composer=" + Math.round((document.querySelector(".composer")?.getBoundingClientRect().width ?? 0)));
      root.style.width = keep;
    }
    log("ready for screenshot");
  }, 2500);
</script>
</body>
</html>
